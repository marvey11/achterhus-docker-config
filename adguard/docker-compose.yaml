services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ~/.config/adguardhome:/opt/adguardhome/conf
      - ~/.local/share/adguardhome:/opt/adguardhome/work
