version: 1

services:
  apply-git-local-retention:
    image: ghcr.io/marvey11/achterhus-server-tools:latest
    command: ["apply-git-local-retention", "--snapshot-directory", "/target"]
    environment:
      TELEMETRY_API_URL: ${TELEMETRY_API_URL}
    volumes:
      - ${GIT_REPO_SNAPSHOT_DIR}:/target:rw
    network: achterhus-network
    timeout_seconds: 1800

  audiothek-downloader:
    image: ghcr.io/marvey11/codescape-utilities/audiothek-downloader:latest
    environment:
      TELEMETRY_API_URL: ${TELEMETRY_API_URL}
    volumes:
      - ${AUDIOTHEK_DOWNLOADER_APP_DIR}:/data:rw
      - ${PODCAST_STORAGE_DIR}:/podcasts:rw
    network: achterhus-network
    timeout_seconds: 300

  backup-home-files:
    image: ghcr.io/marvey11/achterhus-server-tools:latest
    command: ["backup-home-files", "--source", "/source", "--destination", "/target", "--files-from", "/data/backup-files.txt"]
    environment:
      TELEMETRY_API_URL: ${TELEMETRY_API_URL}
    volumes:
      - ${BACKUP_HOME_FILES_SRC_DIR}:/source:ro
      - ${BACKUP_HOME_FILES_DEST_DIR}:/target:rw
      - ${BACKUP_HOME_FILES_FROM}:/data/backup-files.txt:ro
    network: achterhus-network
    timeout_seconds: 300

  backup-postgres:
    image: ghcr.io/marvey11/achterhus-server-tools:latest
    command: ["backup-postgres", "--destination", "/mnt/pgbackup"]
    environment:
      TELEMETRY_API_URL: ${TELEMETRY_API_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_BACKUP_DIR}:/mnt/pgbackup:rw
    network: achterhus-network
    timeout_seconds: 300

  backup-storage:
    image: ghcr.io/marvey11/achterhus-server-tools:latest
    command: ["backup-storage", "--source", "/mnt/storage", "--destination", "/mnt/mirror"]
    environment:
      TELEMETRY_API_URL: ${TELEMETRY_API_URL}
    volumes:
      - ${BACKUP_SOURCE_DIR}:/mnt/storage:ro
      - ${BACKUP_MIRROR_DIR}:/mnt/mirror:rw
    network: achterhus-network
    timeout_seconds: 1800

  create-git-local-snapshots:
    image: ghcr.io/marvey11/achterhus-server-tools:latest
    command: ["create-git-local-snapshots", "--source", "/source", "--destination", "/target"]
    environment:
      TELEMETRY_API_URL: ${TELEMETRY_API_URL}
    volumes:
      - ${GIT_REPO_BASE_DIR}:/source:ro
      - ${GIT_REPO_SNAPSHOT_DIR}:/target:rw
    network: achterhus-network
    timeout_seconds: 1800

  document-router:
    image: ghcr.io/marvey11/achterhus-utilities/document-router:latest
    environment:
      TELEMETRY_API_URL: ${TELEMETRY_API_URL}
    volumes:
      - ${DOCUMENT_SOURCE_DIR}:/source:rw
      - ${DOCUMENT_STORAGE_DIR}:/target:rw
    network: achterhus-network
    timeout_seconds: 600

  photo-router:
    image: ghcr.io/marvey11/achterhus-utilities/photo-router:latest
    environment:
      TELEMETRY_API_URL: ${TELEMETRY_API_URL}
    volumes:
      - ${PHOTO_SOURCE_DIR}:/source:rw
      - ${PHOTO_STORAGE_DIR}:/target:rw
    network: achterhus-network
    timeout_seconds: 600

  sync-gdrive:
    image: ghcr.io/marvey11/achterhus-server-tools:latest
    command: ["sync-gdrive", "--gdrive-source", "${GDRIVE_SOURCE}", "--destination", "/mnt/gdrivesync"]
    environment:
      TELEMETRY_API_URL: ${TELEMETRY_API_URL}
    volumes:
      - ${RCLONE_CONFIG_DIR}:/home/appuser/.config/rclone:rw
      - ${HOST_SYNC_DIR}:/mnt/gdrivesync:rw
    network: achterhus-network
    timeout_seconds: 300

graphs:
  nightly:
    backup-postgres: []
    create-git-local-snapshots: []
    photo-router: []
    sync-gdrive: []
    apply-git-local-retention:
      - create-git-local-snapshots
    backup-home-files:
      # back up the updated rclone config from the 'sync-gdrive' run
      - sync-gdrive
    document-router:
      # document router also needs to route the file synced from GDrive
      - sync-gdrive
    backup-storage:
      - apply-git-local-retention
      - backup-home-files
      - backup-postgres
      - document-router
      - photo-router

  weekly:
    audiothek-downloader: []
    backup-postgres: []
    create-git-local-snapshots: []
    photo-router: []
    sync-gdrive: []
    apply-git-local-retention:
      - create-git-local-snapshots
    backup-home-files:
      # back up the podcast downloader's manifest as well
      - audiothek-downloader
      # back up the updated rclone config from the 'sync-gdrive' run
      - sync-gdrive
    document-router:
      # document router also needs to route the file synced from GDrive
      - sync-gdrive
    backup-storage:
      - apply-git-local-retention
      - backup-home-files
      - backup-postgres
      - document-router
      - photo-router
