name: achterhus-telemetry

services:
  telemetry-api:
    image: ghcr.io/marvey11/achterhus-telemetry-api:latest
    container_name: telemetry-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://telemetry_app:${TELEMETRY_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - LOG_LEVEL=info
    volumes:
      - telemetry-data:/data
    networks:
      - achterhus-network

  dashboard:
    image: ghcr.io/marvey11/achterhus-telemetry-dashboard:latest
    container_name: telemetry-dashboard
    restart: unless-stopped
    depends_on:
      - telemetry-api
    networks:
      - achterhus-network

volumes:
  telemetry-data:
    driver: local

networks:
  achterhus-network:
    external: true
