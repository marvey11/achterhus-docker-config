services:
  samba:
    image: dperson/samba
    container_name: samba

    environment:
      - USER=${SAMBA_USER};${SAMBA_PASSWORD};${LOCAL_UID};${LOCAL_GID}
    volumes:
      - ${STORAGE_ROOT}:/mnt/storage:shared
      - ${BACKUP_ROOT}:/mnt/backup:shared
      - /home/marvey:/home/marvey
      # Map your custom config over the default one
      - ./samba.conf:/etc/samba/smb.conf:ro
    restart: unless-stopped
    network_mode: host
